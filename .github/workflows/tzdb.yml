name: TZDB

# Refreshes @arkv/timezones from the IANA archive. The generator no-ops when IANA
# reports no changes; when it does write, this commits the data and hands off to
# ci.yml, which is the only workflow allowed to publish (npm trusted publishing is
# configured against that single workflow filename).
on:
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:

jobs:
  tzdb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate timezone data
        run: bun run --filter '@arkv/timezones' generate

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain packages/timezones)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tzdb=$(bun -e "process.stdout.write(require('./packages/timezones/timezones.json').version)")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "IANA data is unchanged, nothing to do."
          fi

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: bun run --filter '@arkv/timezones' typecheck

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: bun run --filter '@arkv/timezones' test

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/timezones
          git commit -m "chore(timezones): update IANA tzdb data to ${{ steps.changes.outputs.tzdb }}" --no-verify
          git push origin HEAD:refs/heads/main

      # A GITHUB_TOKEN push does not trigger workflows, so ask ci.yml to run the
      # release for the commit we just pushed.
      - name: Trigger release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
